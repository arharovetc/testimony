name: Deploy quiz to GitHub Pages

on:
  push:
    branches: [claude/gift-choice-quiz-2e2pxw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement:true turns Pages on for the repo, so no manual toggle
      # in Settings is needed for the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          if compgen -G "photos/*.jpg" > /dev/null || compgen -G "photos/*.png" > /dev/null; then
            mkdir -p _site/photos
            cp photos/*.jpg photos/*.png _site/photos/ 2>/dev/null || true
          fi
          touch _site/.nojekyll
          ls -R _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
